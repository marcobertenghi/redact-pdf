[project]
name = "redact-pdf"
version = "0.2.0"
description = "True redaction of known strings and patterns in PDFs, with a workflow for manual review."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Marco Bertenghi" }]
requires-python = ">=3.10"
dependencies = ["pymupdf>=1.24"]
keywords = ["pdf", "redaction", "anonymization", "privacy", "gdpr", "pii"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Office/Business",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/marcobertenghi/redact-pdf"
Issues = "https://github.com/marcobertenghi/redact-pdf/issues"

[project.scripts]
redact-pdf = "redact_pdf.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[build-system]
requires = ["uv_build>=0.8.0,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "N"]

[tool.mypy]
strict = true
python_version = "3.10"
# PyMuPDF is only partially typed; allow calls into it without weakening our own checks.
untyped_calls_exclude = ["pymupdf"]

[[tool.mypy.overrides]]
module = ["pymupdf", "pymupdf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
